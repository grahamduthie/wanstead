<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WagtailCam - Timelapse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        header {
            background: #16213e;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0f3460;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .logo { max-width: 160px; height: auto; }
        h1 { font-size: 1.1rem; color: #4ade80; }
        .back-btn {
            background: transparent;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .back-btn:hover { background: #4ade80; color: #1a1a2e; }
        .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }

        /* Date selector */
        .controls {
            background: #16213e;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid #4ade80;
            border-radius: 6px;
            background: transparent;
            color: #4ade80;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            min-height: 36px;
        }
        .btn:hover { background: #4ade80; color: #1a1a2e; }
        .btn-secondary { border-color: #555; color: #aaa; }
        .btn-secondary:hover { background: #555; color: #fff; border-color: #555; }
        .btn-active { background: #4ade80 !important; color: #1a1a2e !important; border-color: #4ade80 !important; }

        /* Calendar */
        .calendar-picker { display: none; margin-bottom: 1rem; text-align: center; }
        .calendar-picker.visible { display: block; }
        .calendar {
            background: #16213e;
            border-radius: 10px;
            padding: 0.75rem;
            display: inline-block;
            border: 1px solid #0f3460;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }
        .calendar-header button {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        .calendar-header button:hover { color: #4ade80; background: #0f3460; }
        .calendar-title { font-size: 0.9rem; color: #eee; min-width: 140px; }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 34px);
            gap: 2px;
            text-align: center;
        }
        .cal-hdr { font-size: 0.65rem; color: #555; padding: 0.25rem; }
        .cal-day {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem; color: #555;
            cursor: default; position: relative;
        }
        .cal-day.has-images { color: #eee; background: #1a4a80; cursor: pointer; }
        .cal-day.has-images:hover { background: #2a5a90; }
        .cal-day.selected { background: #4ade80 !important; color: #1a1a2e !important; }
        .cal-day.today { box-shadow: 0 0 0 1px #4ade80; }
        .cal-day .dot {
            position: absolute; bottom: 3px;
            width: 4px; height: 4px;
            border-radius: 50%; background: #4ade80;
        }
        .cal-day.selected .dot { background: #1a1a2e; }

        /* Viewer card */
        .card { border-radius: 12px; overflow: hidden; background: #16213e; margin-bottom: 1rem; }
        .viewer {
            background: #000;
            text-align: center;
            min-height: 320px;
            display: flex; align-items: center; justify-content: center;
        }
        .viewer video { width: 100%; display: block; }
        .viewer-placeholder {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 0.75rem;
            color: #555; font-size: 0.9rem;
            padding: 3rem 2rem; text-align: center;
            width: 100%;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #333; border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .gen-note { font-size: 0.78rem; color: #555; margin-top: 0.25rem; }

        /* Info + speed bar */
        .info-bar {
            padding: 0.4rem 1rem;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.78rem; color: #888;
            background: #0f3460; gap: 0.5rem;
        }
        .speed-bar {
            padding: 0.6rem 1rem;
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.8rem; color: #888; flex-wrap: wrap;
        }
        .speed-btn {
            padding: 0.3rem 0.6rem;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f3460; color: #aaa;
            cursor: pointer; font-size: 0.8rem;
            transition: all 0.15s;
        }
        .speed-btn:hover { background: #1a4a80; color: #eee; }
        .speed-btn.active { background: #4ade80; color: #1a1a2e; border-color: #4ade80; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="/WagtailCam.png" alt="WagtailCam" class="logo">
            <h1>Timelapse</h1>
        </div>
        <a href="/index.html" class="back-btn">&#8592; Back to Live</a>
    </header>
    <div class="container">

        <div class="controls">
            <button class="btn btn-secondary" id="btnYesterday" onclick="loadYesterday()">Yesterday</button>
            <button class="btn btn-secondary" id="btnToday" onclick="loadToday()">Today</button>
            <button class="btn btn-secondary" id="btnOther" onclick="toggleCalendar()">Other Date &#9660;</button>
        </div>

        <div class="calendar-picker" id="calendarPicker">
            <div class="calendar">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">&#9664;</button>
                    <span class="calendar-title" id="calendarTitle"></span>
                    <button onclick="changeMonth(1)">&#9654;</button>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
        </div>

        <div class="card">
            <div class="viewer" id="viewer">
                <div class="viewer-placeholder" id="placeholder">
                    <span>Select a date above to view timelapse</span>
                </div>
                <video id="tlVideo" playsinline preload="auto"
                       controls style="display:none">
                </video>
            </div>
            <div id="viewerFooter" style="display:none">
                <div class="info-bar">
                    <span id="imageInfo"></span>
                    <span id="dateInfo" style="color:#666"></span>
                </div>
                <div class="speed-bar">
                    <span>Speed:</span>
                    <button class="speed-btn" data-rate="0.5" onclick="setRate(0.5)">0.5×</button>
                    <button class="speed-btn active" data-rate="1" onclick="setRate(1)">1×</button>
                    <button class="speed-btn" data-rate="2" onclick="setRate(2)">2×</button>
                    <button class="speed-btn" data-rate="4" onclick="setRate(4)">4×</button>
                </div>
            </div>
        </div>

    </div>
    <script>
        var apiBase = window.location.protocol + '//' + window.location.host;
        var availableDates = [];
        var currentYear = new Date().getFullYear();
        var currentMonth = new Date().getMonth();
        var selectedDate = null;
        var pollToken = 0;
        var frameTimes = []; // HH:MM string for each frame, indexed by frame number

        var monthNames = ['January','February','March','April','May','June',
                          'July','August','September','October','November','December'];
        var dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        /* ── API ──────────────────────────────────────────────────── */
        function api(path) {
            return fetch(apiBase + path, { credentials: 'include' })
                .then(function(r) { return r.json(); })
                .catch(function(e) { return { ok: false, error: e.message }; });
        }

        /* ── Calendar ─────────────────────────────────────────────── */
        function loadAvailableDates() {
            api('/api/timelapse/dates').then(function(data) {
                if (data.ok && data.dates) {
                    availableDates = data.dates;
                    renderCalendar();
                }
            });
        }

        function renderCalendar() {
            document.getElementById('calendarTitle').textContent =
                monthNames[currentMonth] + ' ' + currentYear;
            var c = document.getElementById('calendarDays');
            c.innerHTML = '';
            dayNames.forEach(function(n) {
                var el = document.createElement('div');
                el.className = 'cal-hdr';
                el.textContent = n;
                c.appendChild(el);
            });
            var firstDay = new Date(currentYear, currentMonth, 1).getDay();
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            var today = new Date(); today.setHours(0, 0, 0, 0);
            for (var i = 0; i < firstDay; i++) {
                var e = document.createElement('div'); e.className = 'cal-day'; c.appendChild(e);
            }
            for (var day = 1; day <= daysInMonth; day++) {
                var ds = currentYear + '-' +
                    String(currentMonth + 1).padStart(2, '0') + '-' +
                    String(day).padStart(2, '0');
                var hasImg = availableDates.some(function(d) { return d.date === ds; });
                var dayDate = new Date(currentYear, currentMonth, day);
                var el = document.createElement('div');
                el.className = 'cal-day';
                el.textContent = day;
                if (hasImg) {
                    el.classList.add('has-images');
                    var dot = document.createElement('span'); dot.className = 'dot';
                    el.appendChild(dot);
                }
                if (ds === selectedDate) el.classList.add('selected');
                if (dayDate.getTime() === today.getTime()) el.classList.add('today');
                if (hasImg && dayDate <= today) {
                    el.onclick = (function(s) { return function() { pickDate(s); }; })(ds);
                }
                c.appendChild(el);
            }
        }

        function toggleCalendar() {
            var p = document.getElementById('calendarPicker');
            var open = p.classList.toggle('visible');
            document.getElementById('btnOther').textContent =
                open ? 'Other Date \u25B2' : 'Other Date \u25BC';
            if (open) { loadAvailableDates(); renderCalendar(); }
        }

        function changeMonth(d) {
            currentMonth += d;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        /* ── Date selection ───────────────────────────────────────── */
        function setActiveBtn(id) {
            ['btnYesterday','btnToday','btnOther'].forEach(function(b) {
                document.getElementById(b).classList.remove('btn-active');
            });
            if (id) document.getElementById(id).classList.add('btn-active');
        }

        function pickDate(ds) {
            selectedDate = ds;
            document.getElementById('calendarPicker').classList.remove('visible');
            document.getElementById('btnOther').textContent = 'Other Date \u25BC';
            setActiveBtn(null);
            renderCalendar();
            loadTimelapse(ds);
        }

        function loadYesterday() {
            var d = new Date(); d.setDate(d.getDate() - 1);
            var s = d.toISOString().split('T')[0];
            currentYear = d.getFullYear(); currentMonth = d.getMonth();
            selectedDate = s; setActiveBtn('btnYesterday');
            renderCalendar(); loadTimelapse(s);
        }

        function loadToday() {
            var d = new Date();
            var s = d.toISOString().split('T')[0];
            currentYear = d.getFullYear(); currentMonth = d.getMonth();
            selectedDate = s; setActiveBtn('btnToday');
            renderCalendar(); loadTimelapse(s);
        }

        /* ── Timelapse loader ─────────────────────────────────────── */
        function loadTimelapse(dateStr) {
            var token = ++pollToken;
            frameTimes = [];

            /* Reset video */
            var vid = document.getElementById('tlVideo');
            vid.pause();
            vid.removeAttribute('src');
            vid.load();
            vid.style.display = 'none';
            document.getElementById('viewerFooter').style.display = 'none';

            /* Show generating state */
            document.getElementById('placeholder').innerHTML =
                '<div class="spinner"></div>' +
                '<span>Generating timelapse video\u2026</span>' +
                '<span class="gen-note">This takes about 30 seconds on first view.</span>';
            document.getElementById('placeholder').style.display = 'flex';

            /* Fetch frame list in parallel — used by timeupdate to show HH:MM */
            api('/api/timelapse/list?date=' + dateStr).then(function(data) {
                if (token !== pollToken) return;
                if (data.ok && data.images) {
                    frameTimes = data.images.map(function(path) {
                        return timeFromFilename(path.split('/').pop());
                    });
                }
            });

            pollStatus(dateStr, token);
        }

        function timeFromFilename(filename) {
            /* "2026-04-18_143000.jpg" → "14:30" */
            var m = filename.match(/_(\d{2})(\d{2})\d{2}\.jpg$/);
            return m ? m[1] + ':' + m[2] : '';
        }

        function pollStatus(dateStr, token) {
            api('/api/timelapse/video/status?date=' + dateStr).then(function(data) {
                if (token !== pollToken) return;  /* stale — user picked a different date */

                if (!data.ok) {
                    document.getElementById('placeholder').innerHTML =
                        '<span>' + (data.error || 'Failed to load timelapse') + '</span>';
                    return;
                }

                if (data.status === 'ready') {
                    showVideo(dateStr);
                } else {
                    /* Still generating — poll again in 3s */
                    setTimeout(function() { pollStatus(dateStr, token); }, 3000);
                }
            });
        }

        function showVideo(dateStr) {
            var vid = document.getElementById('tlVideo');
            vid.src = apiBase + '/api/timelapse/video/file?date=' + dateStr;
            vid.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('viewerFooter').style.display = 'block';

            /* Info bar */
            var entry = availableDates.find(function(d) { return d.date === dateStr; });
            document.getElementById('imageInfo').textContent =
                entry ? entry.count + ' frames' : '';
            document.getElementById('dateInfo').textContent = formatDate(dateStr);
        }

        /* ── Speed control ────────────────────────────────────────── */
        function setRate(rate) {
            document.getElementById('tlVideo').playbackRate = rate;
            document.querySelectorAll('.speed-btn').forEach(function(btn) {
                btn.classList.toggle('active', parseFloat(btn.dataset.rate) === rate);
            });
        }

        /* ── Helpers ──────────────────────────────────────────────── */
        function formatDate(s) {
            var p = s.split('-');
            var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return parseInt(p[2]) + ' ' + m[parseInt(p[1]) - 1] + ' ' + p[0];
        }

        /* Handle video load errors (e.g. session expired, file missing) */
        document.getElementById('tlVideo').addEventListener('error', function() {
            var code = this.error ? this.error.code : 0;
            var msg = code === 4 ? 'Video unavailable \u2014 please refresh'
                                 : 'Video playback error \u2014 please refresh';
            document.getElementById('placeholder').innerHTML = '<span>' + msg + '</span>';
            document.getElementById('placeholder').style.display = 'flex';
            this.style.display = 'none';
            document.getElementById('viewerFooter').style.display = 'none';
        });

        /* Update info bar with the time of the current frame as the video plays */
        document.getElementById('tlVideo').addEventListener('timeupdate', function() {
            if (!frameTimes.length) return;
            var dur = this.duration;
            var idx = (dur && isFinite(dur))
                ? Math.min(Math.floor(this.currentTime / dur * frameTimes.length), frameTimes.length - 1)
                : 0;
            var t = frameTimes[idx];
            document.getElementById('imageInfo').textContent =
                (t ? t + ' \u00b7 ' : '') + frameTimes.length + ' frames';
        });

        /* Space bar plays/pauses the video */
        document.addEventListener('keydown', function(e) {
            var vid = document.getElementById('tlVideo');
            if (e.key === ' ' && vid.style.display !== 'none') {
                e.preventDefault();
                vid.paused ? vid.play() : vid.pause();
            }
        });

        /* ── Init ─────────────────────────────────────────────────── */
        loadAvailableDates();
        loadYesterday();
    </script>
</body>
</html>
