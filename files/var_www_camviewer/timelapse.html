<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WagtailCam - Timelapse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        header {
            background: #16213e;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0f3460;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo { max-width: 160px; height: auto; }
        h1 { font-size: 1.1rem; color: #4ade80; }
        .back-btn {
            background: transparent;
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .back-btn:hover { background: #4ade80; color: #1a1a2e; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }
        .controls {
            background: #16213e;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-start;
            justify-content: center;
        }
        .date-picker {
            text-align: center;
        }
        .date-picker label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .calendar {
            background: #0f3460;
            border-radius: 8px;
            padding: 0.5rem;
            display: inline-block;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .calendar-header button {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem 0.5rem;
        }
        .calendar-header button:hover { color: #4ade80; }
        .calendar-title {
            font-size: 0.9rem;
            color: #eee;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-day-name {
            font-size: 0.65rem;
            color: #666;
            padding: 0.25rem;
        }
        .calendar-day {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            position: relative;
        }
        .calendar-day.empty {
            cursor: default;
        }
        .calendar-day.has-images {
            color: #eee;
            background: #1a4a80;
        }
        .calendar-day.has-images:hover {
            background: #2a5a90;
        }
        .calendar-day.selected {
            background: #4ade80 !important;
            color: #1a1a2e !important;
        }
        .calendar-day.today {
            border: 1px solid #4ade80;
        }
        .calendar-day .image-dot {
            position: absolute;
            bottom: 2px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4ade80;
        }
        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        .calendar-picker {
            display: none;
            margin-top: 0.5rem;
        }
        .calendar-picker.visible {
            display: block;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid #4ade80;
            border-radius: 6px;
            background: transparent;
            color: #4ade80;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn:hover { background: #4ade80; color: #1a1a2e; }
        .btn-secondary { border-color: #666; color: #aaa; }
        .btn-secondary:hover { background: #555; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .viewer {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
        }
        .viewer img {
            width: 100%;
            max-width: 1920px;
            display: block;
            background: #000;
        }
        .viewer-placeholder {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.9rem;
        }
        .info-bar {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            background: #0f3460;
        }
        .playback-controls {
            padding: 0.75rem 1rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .playback-controls button {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f3460;
            color: #eee;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playback-controls button:hover { background: #1a4a80; }
        .playback-controls button:disabled { opacity: 0.3; cursor: default; }
        .play-btn {
            background: transparent !important;
            border: 1px solid #4ade80 !important;
            color: #4ade80 !important;
            font-size: 0.85rem !important;
            min-width: 80px !important;
            width: auto !important;
        }
        .play-btn:hover {
            background: #4ade80 !important;
            color: #1a1a2e !important;
        }
        .progress-bar {
            flex: 1;
            min-width: 150px;
            max-width: 400px;
            height: 8px;
            background: #0f3460;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: #4ade80;
            border-radius: 4px;
            transition: width 0.1s;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #888;
        }
        .speed-control select {
            padding: 0.3rem;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f3460;
            color: #eee;
            font-size: 0.8rem;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #666;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="/WagtailCam.png" alt="WagtailCam" class="logo">
            <h1>Timelapse</h1>
        </div>
        <a href="/" class="back-btn">&#8592; Back to Live</a>
    </header>
    <div class="container">
        <div class="controls">
            <div class="quick-btns">
                <button class="btn btn-secondary" onclick="loadYesterday()">Yesterday</button>
                <button class="btn btn-secondary" onclick="loadToday()">Today</button>
                <button class="btn btn-secondary" onclick="toggleCalendar()">Other Date</button>
            </div>
        </div>
        <div class="calendar-picker" id="calendarPicker">
            <div class="date-picker">
                <div class="calendar">
                    <div class="calendar-header">
                        <button onclick="changeMonth(-1)">&#9664;</button>
                        <span class="calendar-title" id="calendarTitle"></span>
                        <button onclick="changeMonth(1)">&#9654;</button>
                    </div>
                    <div class="calendar-days" id="calendarDays"></div>
                </div>
            </div>
        </div>
        <div class="viewer">
            <div class="viewer-placeholder" id="placeholder">Select a date to view timelapse</div>
            <img id="timelapseImg" style="display:none" alt="Timelapse">
        </div>
        <div class="info-bar" id="infoBar" style="display:none">
            <span id="imageInfo">-</span>
            <span id="dateInfo">-</span>
        </div>
        <div class="playback-controls" id="playbackControls" style="display:none">
            <button onclick="prevImage()" id="prevBtn" disabled>&#9664;</button>
            <div class="progress-bar" id="progressBar">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <button onclick="nextImage()" id="nextBtn" disabled>&#9654;</button>
            <button onclick="play()" id="playBtn" class="play-btn">&#9654; Play</button>
            <div class="speed-control">
                <span>Speed:</span>
                <select id="speedSelect" onchange="setSpeed(this.value)">
                    <option value="100">1x</option>
                    <option value="300" selected>3x</option>
                    <option value="500">5x</option>
                    <option value="1000">10x</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        var images = [];
        var currentIndex = 0;
        var isPlaying = false;
        var playInterval = null;
        var playSpeed = 300;
        var apiBase = window.location.protocol + '//' + window.location.host;
        var availableDates = [];
        var currentYear = new Date().getFullYear();
        var currentMonth = new Date().getMonth();
        var selectedDate = null;
        
        var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        var dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        
        function api(path, options) {
            options = options || {};
            options.credentials = 'include';
            return fetch(apiBase + path, options)
                .then(function(r) { return r.json(); })
                .catch(function(err) { return { ok: false, error: err.message }; });
        }
        
        function loadAvailableDates() {
            api('/api/timelapse/dates')
                .then(function(data) {
                    if (data.ok && data.dates) {
                        availableDates = data.dates;
                        renderCalendar();
                    }
                });
        }
        
        function renderCalendar() {
            var title = monthNames[currentMonth] + ' ' + currentYear;
            document.getElementById('calendarTitle').textContent = title;
            
            var daysContainer = document.getElementById('calendarDays');
            daysContainer.innerHTML = '';
            
            dayNames.forEach(function(name) {
                var dayEl = document.createElement('div');
                dayEl.className = 'calendar-day-name';
                dayEl.textContent = name;
                daysContainer.appendChild(dayEl);
            });
            
            var firstDay = new Date(currentYear, currentMonth, 1).getDay();
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            
            for (var i = 0; i < firstDay; i++) {
                var empty = document.createElement('div');
                empty.className = 'calendar-day empty';
                daysContainer.appendChild(empty);
            }
            
            for (var day = 1; day <= daysInMonth; day++) {
                var dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                dayEl.textContent = day;
                
                var dateStr = currentYear + '-' + 
                    String(currentMonth + 1).padStart(2, '0') + '-' + 
                    String(day).padStart(2, '0');
                
                var hasImages = availableDates.some(function(d) { return d.date === dateStr; });
                
                if (hasImages) {
                    dayEl.classList.add('has-images');
                    var dot = document.createElement('span');
                    dot.className = 'image-dot';
                    dayEl.appendChild(dot);
                }
                
                if (dateStr === selectedDate) {
                    dayEl.classList.add('selected');
                }
                
                var dayDate = new Date(currentYear, currentMonth, day);
                if (dayDate.getTime() === today.getTime()) {
                    dayEl.classList.add('today');
                }
                
                if (dayDate <= today && hasImages) {
                    dayEl.onclick = (function(ds) { return function() { selectDate(ds); }; })(dateStr);
                } else {
                    dayEl.style.opacity = '0.3';
                    dayEl.style.cursor = 'default';
                }
                
                daysContainer.appendChild(dayEl);
            }
        }
        
        function toggleCalendar() {
            var picker = document.getElementById('calendarPicker');
            picker.classList.toggle('visible');
            if (picker.classList.contains('visible')) {
                loadAvailableDates();
                renderCalendar();
            }
        }
        
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }
        
        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            loadTimelapse(dateStr);
        }
        
        function loadDate() {
            if (selectedDate) {
                loadTimelapse(selectedDate);
            }
        }
        
        function loadYesterday() {
            var d = new Date();
            d.setDate(d.getDate() - 1);
            var dateStr = d.toISOString().split('T')[0];
            currentYear = d.getFullYear();
            currentMonth = d.getMonth();
            selectDate(dateStr);
        }
        
        function loadToday() {
            var d = new Date();
            var dateStr = d.toISOString().split('T')[0];
            currentYear = d.getFullYear();
            currentMonth = d.getMonth();
            selectDate(dateStr);
        }
        
        function loadTimelapse(dateStr) {
            showLoading();
            api('/api/timelapse/list?date=' + dateStr)
                .then(function(data) {
                    if (data.ok && data.images) {
                        images = data.images;
                        if (images.length === 0) {
                            showError('No images found for ' + dateStr);
                        } else {
                            currentIndex = 0;
                            showImage(0);
                            document.getElementById('playbackControls').style.display = 'flex';
                        }
                    } else {
                        showError(data.error || 'Failed to load images');
                    }
                })
                .catch(function() {
                    showError('Network error');
                });
        }
        
        function showLoading() {
            document.getElementById('placeholder').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            document.getElementById('placeholder').style.display = 'flex';
            document.getElementById('timelapseImg').style.display = 'none';
            document.getElementById('infoBar').style.display = 'none';
            document.getElementById('playbackControls').style.display = 'none';
        }
        
        function showError(msg) {
            document.getElementById('placeholder').textContent = msg;
            document.getElementById('placeholder').style.display = 'flex';
            document.getElementById('timelapseImg').style.display = 'none';
            document.getElementById('infoBar').style.display = 'none';
        }
        
        function showImage(index) {
            if (index < 0 || index >= images.length) return;
            currentIndex = index;
            var img = document.getElementById('timelapseImg');
            img.src = apiBase + '/api/timelapse/image?path=' + encodeURIComponent(images[index]);
            img.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            
            var time = images[index].split('/').pop().replace('.jpg', '').split('_')[1] || '';
            var formattedTime = time.substring(0,2) + ':' + time.substring(2,4) + ':' + time.substring(4,6);
            document.getElementById('imageInfo').textContent = (index + 1) + ' / ' + images.length + ' - ' + formattedTime;
            document.getElementById('dateInfo').textContent = images.length + ' frames';
            document.getElementById('infoBar').style.display = 'flex';
            
            var pct = ((index + 1) / images.length) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === images.length - 1;
        }
        
        function prevImage() {
            if (currentIndex > 0) showImage(currentIndex - 1);
        }
        
        function nextImage() {
            if (currentIndex < images.length - 1) showImage(currentIndex + 1);
        }
        
        function play() {
            if (isPlaying) {
                stopPlay();
                return;
            }
            isPlaying = true;
            document.getElementById('playBtn').textContent = '\u23F8 Pause';
            playInterval = setInterval(function() {
                if (currentIndex < images.length - 1) {
                    showImage(currentIndex + 1);
                } else {
                    stopPlay();
                }
            }, playSpeed);
        }
        
        function stopPlay() {
            isPlaying = false;
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
            document.getElementById('playBtn').textContent = '\u25B6 Play';
        }
        
        function setSpeed(speed) {
            playSpeed = parseInt(speed);
            if (isPlaying) {
                clearInterval(playInterval);
                playInterval = setInterval(function() {
                    if (currentIndex < images.length - 1) {
                        showImage(currentIndex + 1);
                    } else {
                        stopPlay();
                    }
                }, playSpeed);
            }
        }
        
        document.getElementById('progressBar').addEventListener('click', function(e) {
            var rect = this.getBoundingClientRect();
            var pct = (e.clientX - rect.left) / rect.width;
            var index = Math.floor(pct * images.length);
            showImage(index);
        });
        
        document.addEventListener('keydown', function(e) {
            if (images.length === 0) return;
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === ' ') { e.preventDefault(); play(); }
        });
        
        // Init - load available dates then show today
        loadAvailableDates();
        loadToday();
    </script>
</body>
</html>
